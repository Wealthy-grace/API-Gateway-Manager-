name: API Gateway CI/CD with SonarCloud

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: '17'

jobs:
  # ==========================================
  # Job 1: Build, Test & SonarCloud Analysis
  # ==========================================
  build-and-analyze:
    name: Build & Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones disabled for SonarCloud

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew clean build test jacocoTestReport --info --no-daemon

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.projectKey=Wealthy-grace_API-Gateway-Manager- \
            -Dsonar.organization=wealthy-grace \
            -Dsonar.host.url=https://sonarcloud.io \
            --info \
            --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-jar
          path: build/libs/*.jar
          retention-days: 1

      - name: SonarCloud Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # ==========================================
  # Job 2: Docker Build
  # ==========================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-analyze

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: api-gateway-jar
          path: build/libs/

      - name: Build Docker image
        run: docker build -t api-gateway-manager:test .

      - name: Save Docker image
        run: docker save api-gateway-manager:test | gzip > api-gateway-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-image
          path: api-gateway-image.tar.gz
          retention-days: 1

  # ==========================================
  # Job 3: K6 Performance Tests
  # ==========================================
  performance-tests:
    name: K6 Performance Tests
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: api-gateway-image

      - name: Load Docker image
        run: docker load < api-gateway-image.tar.gz

      - name: Create Docker network
        run: docker network create shared-microservices-network || true

      - name: Start Keycloak
        run: |
          docker run -d --name keycloak \
            --network shared-microservices-network \
            -p 8090:8090 \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin123 \
            -e KC_HTTP_PORT=8090 \
            -e KC_HOSTNAME_STRICT=false \
            -e KC_HTTP_ENABLED=true \
            quay.io/keycloak/keycloak:23.0 start-dev --http-port=8090

      - name: Wait for Keycloak
        run: |
          echo " Waiting for Keycloak to start..."
          timeout 180 bash -c 'until curl -s http://localhost:8090/realms/master/.well-known/openid-configuration > /dev/null; do echo "Waiting..."; sleep 5; done'
          echo " Keycloak is ready!"
          sleep 10  # Extra time for Keycloak to fully initialize

      - name: Configure Keycloak
        run: |
          echo "🔧 Configuring Keycloak..."
          
          # Get admin token
          ADMIN_TOKEN=$(curl -s -X POST http://localhost:8090/realms/master/protocol/openid-connect/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=admin&password=admin123&grant_type=password&client_id=admin-cli" | jq -r '.access_token')
          
          if [ "$ADMIN_TOKEN" == "null" ] || [ -z "$ADMIN_TOKEN" ]; then
            echo " Failed to get admin token from Keycloak"
            exit 1
          fi
          
          echo " Got admin token"
          
          # Create realm
          echo "Creating realm..."
          curl -s -X POST http://localhost:8090/admin/realms \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"realm":"friendly-housing","enabled":true,"sslRequired":"none"}' || echo "Realm might already exist"
          
          # Create client
          echo "Creating client..."
          curl -s -X POST http://localhost:8090/admin/realms/friendly-housing/clients \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "clientId":"friendly-housing-client",
              "enabled":true,
              "clientAuthenticatorType":"client-secret",
              "secret":"Lrf6ZwUcAqOnvg4fl89kKyiOLCaWDb6B",
              "directAccessGrantsEnabled":true,
              "publicClient":false,
              "redirectUris":["*"]
            }' || echo "Client might already exist"
          
          # Create user
          echo "Creating user..."
          curl -s -X POST http://localhost:8090/admin/realms/friendly-housing/users \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "username":"jennifer275",
              "email":"Jenny_275@gmail.com",
              "enabled":true,
              "credentials":[{"type":"password","value":"MeiChen@Edu4!","temporary":false}]
            }' || echo "User might already exist"
          
          echo " Keycloak configuration complete"

      - name: Start mock services
        run: |
          for service in user-service-app:8081 property-service-app:8082 appointment-service-app:8083 booking-service:8084 notification-service:8085; do
            name=$(echo $service | cut -d: -f1)
            port=$(echo $service | cut -d: -f2)
            docker run -d --name $name \
              --network shared-microservices-network \
              -p $port:5678 \
              hashicorp/http-echo:latest -text="$name-mock" -listen=:5678 || true
          done

      - name: Start API Gateway
        run: |
          docker run -d --name api-gateway-manager \
            --network shared-microservices-network \
            -p 9500:9500 \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI=http://keycloak:8090/realms/friendly-housing/protocol/openid-connect/token \
            -e SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI=http://keycloak:8090/realms/friendly-housing/protocol/openid-connect/certs \
            -e SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8090/realms/friendly-housing/protocol/openid-connect/certs \
            api-gateway-manager:test

      - name: Wait for API Gateway
        run: |
          echo " Waiting for API Gateway to start..."
          timeout 180 bash -c 'until curl -s http://localhost:9500/actuator/health | grep -q "UP"; do echo "Waiting..."; sleep 5; done'
          echo " API Gateway is ready!"
          sleep 5  # Extra time for full initialization

      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run K6 Quick Test
        run: k6 run scenarios/quick-test.js
        env:
          GATEWAY_URL: http://localhost:9500
          KEYCLOAK_URL: http://localhost:8090
        continue-on-error: true

      - name: Show logs on failure
        if: failure()
        run: |
          echo " API Gateway logs:"
          docker logs api-gateway-manager || echo "API Gateway container not found"
          echo ""
          echo " Keycloak logs:"
          docker logs keycloak || echo "Keycloak container not found"

      - name: Cleanup
        if: always()
        run: |
          docker stop api-gateway-manager keycloak user-service-app property-service-app appointment-service-app booking-service notification-service || true
          docker rm api-gateway-manager keycloak user-service-app property-service-app appointment-service-app booking-service notification-service || true

  # ==========================================
  # Job 4: Push to Docker Hub
  # ==========================================
  docker-push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [build-and-analyze, performance-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/api-gateway-manager:latest
            ${{ secrets.DOCKER_USERNAME }}/api-gateway-manager:${{ github.sha }}
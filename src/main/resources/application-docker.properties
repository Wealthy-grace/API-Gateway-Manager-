# Disable OAuth2 Client auto-configuration for manual setup
spring.security.oauth2.client.registration.keycloak.client-id=friendly-housing-client
spring.security.oauth2.client.registration.keycloak.client-secret=Lrf6ZwUcAqOnvg4fl89kKyiOLCaWDb6B
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Provider configuration - manually specify all URLs instead of using issuer-uri
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:8090/realms/friendly-housing/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8090/realms/friendly-housing/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost:8090/realms/friendly-housing/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://localhost:8090/realms/friendly-housing/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Resource server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8090/realms/friendly-housing/protocol/openid-connect/certs
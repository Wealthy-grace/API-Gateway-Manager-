# ==========================================
# API Gateway Manager - Docker Configuration
# ==========================================

spring.application.name=Api-Gateway-Manager
server.port=9500

# ? CRITICAL: Use SERVLET (MVC) - NOT REACTIVE
spring.main.web-application-type=servlet

# ==========================================
# KEYCLOAK CONFIGURATION (Docker)
# ==========================================
# Use Docker Compose service name
keycloak.auth-server-url=http://keycloak:8080
keycloak.realm=friendly-housing
keycloak.resource=user-service
keycloak.credentials.secret=w17mfIu8cNiHihx8hYZEHLkEkjEA1BIf

# ==========================================
# JWT RESOURCE SERVER (Docker)
# ==========================================
# IMPORTANT:
# - issuer-uri uses localhost (what's in the JWT token)
# - jwk-set-uri uses internal Docker service name
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/friendly-housing
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/certs

# ==========================================
# OAUTH2 CLIENT CONFIGURATION
# ==========================================
spring.security.oauth2.client.registration.keycloak.client-id=user-service
spring.security.oauth2.client.registration.keycloak.client-secret=w17mfIu8cNiHihx8hYZEHLkEkjEA1BIf
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://keycloak:8080/realms/friendly-housing
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://localhost:8080/realms/friendly-housing/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# ==========================================
# CIRCUIT BREAKER
# ==========================================
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=100
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=60s

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway,routes
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ==========================================
# METRICS
# ==========================================
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.service=api-gateway
management.prometheus.metrics.export.enabled=true

# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
logging.level.com.example.apigatewaymanager=DEBUG

# ==========================================
# SERVICE URLS (Docker Compose)
# ==========================================
# Use Docker Compose service names from shared-microservices-network
services.user-service.url=http://user-service-app:8081
services.property-service.url=http://property-service-app:8082
services.appointment-service.url=http://appointment-service-app:8083
services.booking-service.url=http://booking-service-app:8084
services.notification-service.url=http://notification-service-app:8085

# ==========================================
# DISABLE COMPATIBILITY VERIFIER
# ==========================================
spring.cloud.compatibility-verifier.enabled=false
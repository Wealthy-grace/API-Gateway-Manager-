# =========================================================
# Docker Environment Configuration
# =========================================================

# =========================================================
# Spring Cloud Gateway Routes (Docker Network)
# =========================================================

# User Service Routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://user-service-app:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/internal/**

# Property Service Routes
spring.cloud.gateway.routes[1].id=property-service
spring.cloud.gateway.routes[1].uri=http://property-service-app:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/properties/**

# Appointment Service Routes
spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=http://appointment-service-app:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/appointments/**

# Booking Service Routes
spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=http://booking-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**

# Notification Service Routes
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=http://notification-service:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

# =========================================================
# Security Configuration - Docker Network
# =========================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8090/realms/friendly-housing
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8090/realms/friendly-housing/protocol/openid-connect/certs

# =========================================================
# Logging
# =========================================================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
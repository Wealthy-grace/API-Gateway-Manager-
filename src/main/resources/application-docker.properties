# =========================================================
# Docker Environment Configuration - PERFORMANCE OPTIMIZED
# =========================================================

# =========================================================
# CRITICAL: Performance & Connection Pool Settings
# =========================================================

# HTTP Client Configuration (CRITICAL FOR LOAD HANDLING)
spring.cloud.gateway.httpclient.pool.type=FIXED
spring.cloud.gateway.httpclient.pool.max-connections=500
spring.cloud.gateway.httpclient.pool.max-idle-time=30s
spring.cloud.gateway.httpclient.pool.acquire-timeout=45000
spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=30000

# Server Thread Pool (CRITICAL FOR CONCURRENT REQUESTS)
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# Connection Limits (PREVENTS CONNECTION EXHAUSTION)
server.tomcat.max-connections=10000
server.tomcat.accept-count=100

# Keep-Alive Settings (IMPROVES PERFORMANCE)
server.tomcat.connection-timeout=60000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100

# =========================================================
# Spring Cloud Gateway Routes (Docker Network)
# =========================================================

# User Service Routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://user-service-app:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/internal/**

# Property Service Routes
spring.cloud.gateway.routes[1].id=property-service
spring.cloud.gateway.routes[1].uri=http://property-service-app:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/properties/**

# Appointment Service Routes
spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=http://appointment-service-app:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/appointments/**

# Booking Service Routes - FIXED HOSTNAME
spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=http://booking-service-app:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**

# Notification Service Routes
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=http://notification-service:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

# =========================================================
# Security Configuration - Docker Network
# =========================================================
# Keycloak Admin Client Configuration - Docker
keycloak.auth-server-url=http://keycloak:8080
keycloak.realm=friendly-housing
keycloak.resource=user-service
keycloak.credentials.secret=w17mfIu8cNiHihx8hYZEHLkEkjEA1BIf

# OAuth2 Resource Server (for JWT validation)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/friendly-housing
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/certs

spring.application.name=Api-Gateway-Manager
server.port=9500
spring.main.web-application-type=reactive

# Routes - Default (localhost)
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/internal/**,/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=property-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/properties/**

spring.cloud.gateway.server.webflux.routes[2].id=appointment-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/appointments/**

spring.cloud.gateway.server.webflux.routes[3].id=booking-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notifications/**

# HTTP Client (Reactive - Netty)
spring.cloud.gateway.server.webflux.httpclient.pool.type=FIXED
spring.cloud.gateway.server.webflux.httpclient.pool.max-connections=500
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=30s
spring.cloud.gateway.server.webflux.httpclient.pool.acquire-timeout=45000
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=10000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s

# CORS
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedOrigins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:4173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowCredentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].maxAge=3600



# JWT Token Relay
#spring.cloud.gateway.server.webflux.default-filters[0]=TokenRelay

# Security - Default
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/friendly-housing
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/friendly-housing/protocol/openid-connect/certs

# Keycloak
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=friendly-housing
keycloak.resource=user-service
keycloak.credentials.secret=w17mfIu8cNiHihx8hYZEHLkEkjEA1BIf

# Circuit Breaker
resilience4j.circuitbreaker.instances.default.slidingWindowSize=10
resilience4j.circuitbreaker.instances.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.default.failureRateThreshold=50
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=10s

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway,routes
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.service=api-gateway
management.metrics.enable.spring.cloud.gateway=true
management.metrics.distribution.percentiles-histogram.spring.cloud.gateway.requests=true

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.reactor.netty.http.client=DEBUG
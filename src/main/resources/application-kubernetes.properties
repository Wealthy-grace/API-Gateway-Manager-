# =========================================================
# Kubernetes Profile Configuration for API Gateway
# =========================================================
# This file is loaded when SPRING_PROFILES_ACTIVE=kubernetes

spring.application.name=Api-Gateway-Manager
server.port=9500
server.servlet.context-path=/

# =========================================================
# Spring Cloud Gateway Routes Configuration - KUBERNETES
# =========================================================

# User Service Routes (Internal Kubernetes Service)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://user-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/internal/**,/api/users/**

# Property Service Routes (Internal Kubernetes Service)
spring.cloud.gateway.routes[1].id=property-service
spring.cloud.gateway.routes[1].uri=http://property-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/properties/**

# Appointment Service Routes (Internal Kubernetes Service)
spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=http://appointment-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/appointments/**

# Booking Service Routes (Internal Kubernetes Service)
spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=http://booking-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**

# Notification Service Routes (Internal Kubernetes Service)
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=http://notification-service:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

# =========================================================
# Global CORS Configuration for Gateway
# =========================================================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:4173
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600

# =========================================================
# Keycloak OAuth2 Configuration - KUBERNETES
# =========================================================

# OAuth2 Client Configuration
spring.security.oauth2.client.registration.keycloak.client-id=api-gateway-manager
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 Provider Configuration - INTERNAL Kubernetes service
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://keycloak:8080/realms/friendly-housing
spring.security.oauth2.client.provider.keycloak.authorization-uri=http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.user-info-uri=http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/userinfo
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Resource Server JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/friendly-housing
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/certs

# Keycloak Admin Client Configuration
keycloak.auth-server-url=http://keycloak:8080
keycloak.realm=friendly-housing
keycloak.resource=api-gateway-manager

# =========================================================
# Actuator Configuration
# =========================================================
management.endpoints.web.exposure.include=health,info,gateway,routes,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# =========================================================
# HTTP Client Configuration
# =========================================================
spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=30s
spring.cloud.gateway.httpclient.pool.max-connections=500

# =========================================================
# Logging (Reduced for Production)
# =========================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.boot.actuate=DEBUG
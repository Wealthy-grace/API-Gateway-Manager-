services:
  # ==========================================
  # API GATEWAY (Port 9500)
  # ==========================================
  api-gateway:
    image: eclipse-temurin:21-jre-alpine
    container_name: api-gateway-manager
    working_dir: /app
    volumes:
      - ./build/libs:/app
    command: sh -c "apk add --no-cache curl && java -Djava.security.egd=file:/dev/./urandom -Dspring.profiles.active=docker -jar /app/Api-Gateway-Manager-0.0.1-SNAPSHOT.jar"
    environment:
      # Service URLs (using actual container names from your running services)
      USER_SERVICE_URL: http://user-service-app:8081
      PROPERTY_SERVICE_URL: http://property-service-app:8082
      APPOINTMENT_SERVICE_URL: http://appointment-service-app:8083
      BOOKING_SERVICE_URL: http://booking-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085

      # Override application.properties with Docker-friendly URLs
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://user-service-app:8081
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://property-service-app:8082
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://appointment-service-app:8083
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://booking-service:8084
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://notification-service:8085

      # Keycloak Client Configuration
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID: friendly-housing-client
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: Lrf6ZwUcAqOnvg4fl89kKyiOLCaWDb6B
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE: openid,profile,email

      # Keycloak Provider URLs (Manual configuration to avoid issuer mismatch)
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: http://host.docker.internal:8090/realms/friendly-housing/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://host.docker.internal:8090/realms/friendly-housing/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI: http://host.docker.internal:8090/realms/friendly-housing/protocol/openid-connect/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://host.docker.internal:8090/realms/friendly-housing/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_NAME_ATTRIBUTE: preferred_username

      # Resource Server JWT Configuration
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://host.docker.internal:8090/realms/friendly-housing/protocol/openid-connect/certs

      SERVER_PORT: 9500
    ports:
      - "9500:9500"
    networks:
      - shared-microservices-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9500/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  shared-microservices-network:
    external: true
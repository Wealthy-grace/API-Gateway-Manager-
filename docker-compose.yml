services:
  # ==========================================
  # API GATEWAY (Port 9500) - COMPLETE & FIXED
  # ==========================================
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: godfrey10/api-gateway-manager:latest
    container_name: api-gateway-manager
    environment:
      # =========================================================
      # Service URLs - Internal Docker Network
      # =========================================================
      USER_SERVICE_URL: http://user-service-app:8081
      PROPERTY_SERVICE_URL: http://property-service-app:8082
      APPOINTMENT_SERVICE_URL: http://appointment-service-app:8083
      BOOKING_SERVICE_URL: http://booking-service-app:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085

      # =========================================================
      # Spring Cloud Gateway Routes - Docker Network
      # =========================================================
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: user-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://user-service-app:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/auth/**,/api/internal/**,/api/users/**

      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: property-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://property-service-app:8082
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/api/v1/properties/**

      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: appointment-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://appointment-service-app:8083
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/v1/appointments/**

      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: booking-service
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://booking-service-app:8084
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/api/bookings/**

      SPRING_CLOUD_GATEWAY_ROUTES_4_ID: notification-service
      SPRING_CLOUD_GATEWAY_ROUTES_4_URI: http://notification-service:8085
      SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: Path=/api/notifications/**

      # =========================================================
      # CORS Configuration
      # =========================================================
      SPRING_CLOUD_GATEWAY_GLOBALCORS_ADD_TO_SIMPLE_URL_HANDLER_MAPPING: true
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:4173
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWED_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWED_HEADERS: "*"
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOW_CREDENTIALS: true
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_MAX_AGE: 3600

      # =========================================================
      # Keycloak Configuration - FIXED TO USE user-service CLIENT
      # =========================================================
      # Keycloak Server URL (Internal Docker Network)
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: friendly-housing
      KEYCLOAK_RESOURCE: user-service
      KEYCLOAK_CREDENTIALS_SECRET: w17mfIu8cNiHihx8hYZEHLkEkjEA1BIf

      # OAuth2 Client Registration
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID: user-service
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: w17mfIu8cNiHihx8hYZEHLkEkjEA1BIf
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE: authorization_code
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE: openid,profile,email
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI: "{baseUrl}/login/oauth2/code/{registrationId}"

      # OAuth2 Provider Configuration (Internal Docker)
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/friendly-housing
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_NAME_ATTRIBUTE: preferred_username

      # Resource Server JWT Configuration
      # CRITICAL: issuer-uri must match the "iss" claim in the token (localhost:8080)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/friendly-housing
      # But jwk-set-uri uses internal docker network (keycloak:8080) to fetch keys
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/certs

      # =========================================================
      # Performance & Connection Pool Settings
      # =========================================================
      # HTTP Client Configuration
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_POOL_TYPE: FIXED
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_POOL_MAX_CONNECTIONS: 500
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_POOL_MAX_IDLE_TIME: 30s
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_POOL_ACQUIRE_TIMEOUT: 45000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: 10000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: 30s

      # Server Thread Pool
      SERVER_TOMCAT_THREADS_MAX: 200
      SERVER_TOMCAT_THREADS_MIN_SPARE: 20
      SERVER_TOMCAT_MAX_CONNECTIONS: 10000
      SERVER_TOMCAT_ACCEPT_COUNT: 100

      # Keep-Alive Settings
      SERVER_TOMCAT_CONNECTION_TIMEOUT: 60000
      SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT: 60000
      SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS: 100

      # =========================================================
      # Application Settings
      # =========================================================
      SPRING_APPLICATION_NAME: Api-Gateway-Manager
      SERVER_PORT: 9500
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: true

      # =========================================================
      # Actuator Configuration
      # =========================================================
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,gateway,routes,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: true
      MANAGEMENT_HEALTH_LIVENESS_STATE_ENABLED: true
      MANAGEMENT_HEALTH_READINESS_STATE_ENABLED: true
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: true
      MANAGEMENT_METRICS_TAGS_APPLICATION: Api-Gateway-Manager
      MANAGEMENT_METRICS_TAGS_SERVICE: api-gateway

      # =========================================================
      # Logging Configuration
      # =========================================================
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2: INFO
      LOGGING_LEVEL_REACTOR_NETTY_HTTP_CLIENT: DEBUG

    ports:
      - "9500:9500"

    networks:
      - shared-microservices-network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9500/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

networks:
  shared-microservices-network:
    external: true
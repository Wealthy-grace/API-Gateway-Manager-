apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: student-housing
data:
  # =========================================================
  # APPLICATION SETTINGS
  # =========================================================
  SPRING_APPLICATION_NAME: "Api-Gateway-Manager"
  SERVER_PORT: "9500"
  SPRING_PROFILES_ACTIVE: "kubernetes"
  SPRING_MAIN_WEB_APPLICATION_TYPE: "servlet"

  # =========================================================
  # KEYCLOAK CONFIGURATION (Kubernetes Internal DNS)
  # =========================================================
  KEYCLOAK_AUTH_SERVER_URL: "http://keycloak.student-housing.svc.cluster.local:8080"
  KEYCLOAK_REALM: "friendly-housing"
  KEYCLOAK_RESOURCE: "api-gateway"

  # =========================================================
  # JWT RESOURCE SERVER CONFIGURATION (ONLY - NO CLIENT)
  # Accept tokens from localhost:8080, fetch keys from cluster DNS
  # =========================================================
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8080/realms/friendly-housing"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/realms/friendly-housing/protocol/openid-connect/certs"

  # =========================================================
  # CIRCUIT BREAKER CONFIGURATION
  # =========================================================
  RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_REGISTER_HEALTH_INDICATOR: "true"
  RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_SLIDING_WINDOW_SIZE: "10"
  RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_MINIMUM_NUMBER_OF_CALLS: "5"
  RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_PERMITTED_NUMBER_OF_CALLS_IN_HALF_OPEN_STATE: "3"
  RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_AUTOMATIC_TRANSITION_FROM_OPEN_TO_HALF_OPEN_ENABLED: "true"
  RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_WAIT_DURATION_IN_OPEN_STATE: "10s"
  RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_FAILURE_RATE_THRESHOLD: "50"
  RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_SLOW_CALL_RATE_THRESHOLD: "100"
  RESILIENCE4J_CIRCUITBREAKER_CONFIGS_DEFAULT_SLOW_CALL_DURATION_THRESHOLD: "60s"

  # =========================================================
  # ACTUATOR CONFIGURATION
  # =========================================================
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus,gateway,routes"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESS_STATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESS_STATE_ENABLED: "true"

  # =========================================================
  # LOGGING CONFIGURATION
  # =========================================================
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "DEBUG"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2: "DEBUG"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: "INFO"
  LOGGING_LEVEL_COM_EXAMPLE_APIGATEWAYMANAGER: "DEBUG"

  # =========================================================
  # DISABLE COMPATIBILITY VERIFIER
  # =========================================================
  SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED: "false"

---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secret
  namespace: student-housing
type: Opaque
stringData:
  # Keep this for Keycloak Admin API access if needed
  KEYCLOAK_CREDENTIALS_SECRET: "qrNh7ha06Vz7yEc82otI1TLst2PVf19c"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: student-housing
  labels:
    app: api-gateway
    version: "v1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: "v1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9500"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # No init container needed - Resource Server doesn't require Keycloak at startup
      containers:
        - name: api-gateway
          image: godfrey10/api-gateway-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9500
              name: http
              protocol: TCP

          envFrom:
            - configMapRef:
                name: api-gateway-config

          env:
            - name: KEYCLOAK_CREDENTIALS_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secret
                  key: KEYCLOAK_CREDENTIALS_SECRET

            # JVM Settings
            - name: JAVA_OPTS
              value: >-
                -Xms512m 
                -Xmx1024m 
                -XX:+UseG1GC 
                -XX:MaxGCPauseMillis=200
                -XX:+HeapDumpOnOutOfMemoryError
                -XX:HeapDumpPath=/tmp/heapdump.hprof

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9500
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9500
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9500
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: student-housing
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9500
      targetPort: 9500
      protocol: TCP
  selector:
    app: api-gateway

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  namespace: student-housing
  labels:
    app: api-gateway
spec:
  type: NodePort
  ports:
    - name: http
      port: 9500
      targetPort: 9500
      #nodePort: 30950
      protocol: TCP
  selector:
    app: api-gateway